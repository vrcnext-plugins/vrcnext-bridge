[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
license = "Unlicense"
repository = "https://github.com/vrcnext-plugins/vrcnext-bridge"
authors = ["vrcnext-plugins"]

[workspace.dependencies]
vrcnext-bridge-core = { path = "crates/vrcnext-bridge-core", version = "0.6.0" }
vrcnext-bridge-sinks = { path = "crates/vrcnext-bridge-sinks", version = "0.6.0" }
vrcnext-bridge-plugins = { path = "crates/vrcnext-bridge-plugins", version = "0.6.0" }
vrcnext-bridge-win = { path = "crates/vrcnext-bridge-win", version = "0.6.0" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Platform directories (home, %LOCALAPPDATA%, %APPDATA%). Pure Rust, no I/O beyond env/getpwuid.
dirs = "7"
# Randomness for the pairing token, straight from the OS.
getrandom = "0.4"
# Transport. No TLS anywhere: the bridge is loopback-only and stays pure Rust.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Git, in pure Rust: no shell, no system git, TLS via rustls. Only the pieces a depth-1 clone,
# a fetch and a worktree checkout need; the default set pulls in blame, merge and status.
gix = { version = "0.88", default-features = false, features = [
    "blocking-http-transport-reqwest-rust-tls",
    "worktree-mutation",
    "revision",
    "max-performance-safe",
    "sha1",
] }
# SHA-256 for the esbuild checksum and the plugin tree digest.
sha2 = "0.11"
# SQLite for the `sql` service, which reads VRCNext's own databases. `bundled` compiles SQLite
# from the vendored C source rather than linking the system library: this host is an immutable OS
# where a shared libsqlite is not ours to depend on, and the version is then the one the tests ran
# against. Deliberately no `hooks` or `load_extension`: the service never runs a callback out of
# SQLite and never loads an extension, which would be arbitrary native code from a plugin's query.
# `limits` is a compile-time switch, not a callback: it lets the service set ATTACHED to zero, so
# a statement cannot open a second database file beside the one its alias names.
rusqlite = { version = "0.38", features = ["bundled", "column_decltype", "limits"] }
# Ed25519 verification for plugin signatures. Pure Rust, no OS crypto library.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
# Outbound HTTP for the `outbound` service. Already in the tree through gix's transport, so this
# adds a blocking client rather than a second TLS stack.
# `cookies` is deliberately absent: with no jar, a `Set-Cookie` the outbound service receives
# cannot be replayed to another host, and `Cookie` is refused on the way out. Do not add it.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "charset", "http2", "gzip"] }
# OSC 1.0 encode/decode for the `osc` service. Pure Rust, no C toolchain; the wire format has
# enough corners (type tags, 4-byte padding, nested bundles) that hand-rolling it would be
# rediscovering them slowly.
rosc = { version = "0.11", default-features = false }
# Win32 bindings for the native confirmation dialog. Pure Rust, no headers.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
integer_division = "deny"
too_many_lines = "deny"
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Deliberately *not* `panic = "abort"`. This is a long-lived daemon: a residual panic in one
# worker thread must cost that one request, not the whole process. The request loop unwinds it.
